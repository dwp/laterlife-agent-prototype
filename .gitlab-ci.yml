stages:
  - code-quality
  - heroku-publish

include:
  - local: "/gitlab-ci/includes.yml"

fragment-version-check:
  extends: .fragment-version-check-template

gitleaks:
  extends: .gitleaks-template

shell-check:
  extends: .shell-check-template

todo-check:
  extends: .todo-check-template

heroku-site-publish:
  extends: .heroku-site-publish-template
  variables:
    HEROKU_APP_NAME: laterlife-agent-prototype


install-dependencies:
  image: node:18@sha256:c6ae79e38498325db67193d391e6ec1d224d96c693a8a4d943498556716d3783
  stage: build
  script:
    - npm install